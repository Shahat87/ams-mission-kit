<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img">
<title>AMS Mission Control board flow</title>
<desc>Cards flow Backlog, Ready, Building, QA, Review, Merge gate, staging, Done. Review bounces to Ready or QA. Blocked cards wait for a human. main is merged by a human only.</desc>
